# Crea una GitHub Release quando si pubblica un tag "vX.Y.Z".
# La versione del tag deve coincidere con quella in Cargo.toml.
#
#   git tag v4.0.0 && git push origin v4.0.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verifica versione
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Il tag ${{ github.ref_name }} non corrisponde a Cargo.toml ($v)" }

      - name: Test
        run: cargo test --release

      - name: Installa Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build (exe, setup, zip)
        shell: pwsh
        run: ./scripts/build-release.ps1 -FetchTools

      - name: Pubblica la release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: YT Downloader ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/YTDownloader-Setup-*.exe
            dist/YTDownloader-*-win64.zip
            dist/SHA256SUMS.txt

      - name: Artefatti (avvio manuale)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: YTDownloader
          path: |
            dist/YTDownloader-Setup-*.exe
            dist/SHA256SUMS.txt
