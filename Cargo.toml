[package]
name = "yt-downloader"
version = "4.0.0"
edition = "2021"
authors = ["Gab8bit"]
description = "YT Downloader - GUI nativa per yt-dlp"
license = "MIT"
repository = "https://github.com/Gab8bit/YouTube-Downloader"
build = "build.rs"

[[bin]]
name = "YTDownloader"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.18"
sha2 = "0.10"
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Globalization",
] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
